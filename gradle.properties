android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Room schema export
room.schemaLocation=$projectDir/schemas

# Optional: Chaquopy Python runtime (disabled by default to keep the shell buildable without CPython).
# Enable by adding `-PenableChaquopy=true` and applying the Chaquopy plugin in :core:source.
enableChaquopy=false

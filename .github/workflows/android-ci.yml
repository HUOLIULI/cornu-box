name: Android CI

on:
  push:
    branches:
      - main
      - master
      - '261009-feat-media-shell-p2-enhancements'
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload Debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/
          retention-days: 7

      - name: Build Release APK
        if: github.event_name == 'push'
        run: |
          if [ -f "keystore/cornu-release.jks" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="keystore/cornu-release.jks" \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_SIGNING_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="cornu" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_SIGNING_PASSWORD }}"
          else
            echo "No release keystore found, skipping signed release build"
          fi

      - name: Upload Release APK
        if: github.event_name == 'push' && hashFiles('keystore/cornu-release.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/
          retention-days: 7
